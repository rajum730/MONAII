<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#08060f" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b88" />
      <stop offset="50%" stop-color="#8a3ffc" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff3b88" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neon)" stroke-width="12" filter="url(#neon-glow)" />

  <!-- Center Holographic AI Core / Lotus / M -->
  <path d="M160 330 L160 190 L220 260 L256 220 L292 260 L352 190 L352 330" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Eye / Diamond Core -->
  <circle cx="256" cy="180" r="14" fill="#00f2fe" filter="url(#neon-glow)" />
  <circle cx="256" cy="180" r="7" fill="#ffffff" />

  <!-- Pulsing Orbit Dots -->
  <circle cx="160" cy="256" r="6" fill="#ff3b88" />
  <circle cx="352" cy="256" r="6" fill="#00f2fe" />
  <circle cx="256" cy="350" r="6" fill="#8a3ffc" />
</svg>
